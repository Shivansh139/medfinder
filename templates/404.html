{% extends "base.html" %}
{# Django automatically uses this template for "page not found" when DEBUG is off. #}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-6">404 – Page not found</h1>
  <p class="text-muted">The page you are looking for does not exist, or you cannot view it.</p>
  <a class="btn btn-success" href="{% url 'home' %}">Back to home</a>
</div>
{% endblock %}
