{% extends "base.html" %}
{# Django automatically uses this template when a view raises PermissionDenied. #}

{% block title %}Access denied{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-6">403 – Access denied</h1>
  <p class="text-muted">Your account does not have permission to view this page.</p>
  <a class="btn btn-success" href="{% url 'home' %}">Back to home</a>
</div>
{% endblock %}
